<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc"><title id="title">Bocetos preliminares de EcoReto</title><desc id="desc">Seis bocetos de navegación y pantallas iniciales. No son capturas de una aplicación ejecutada.</desc><rect width="1080" height="680" fill="#f1f5f1"/><text x="30" y="38" font-family="sans-serif" font-size="23" fill="#14532d">EcoReto · bocetos de revisión 1</text><g font-family="sans-serif"><rect x="30" y="65" width="320" height="270" rx="15" fill="white" stroke="#a7b9ab"/><rect x="31" y="66" width="318" height="50" rx="14" fill="#14532d"/><text x="48" y="97" fill="white" font-size="18">Catálogo</text><rect x="44" y="137" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="52" y="164" font-size="14" fill="#1e3924">Buscar reto · categoría</text><rect x="44" y="194" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="52" y="221" font-size="14" fill="#1e3924">Tarjeta: fecha y puntos</text><rect x="44" y="251" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="52" y="278" font-size="14" fill="#1e3924">Ver detalle →</text></g><g font-family="sans-serif"><rect x="380" y="65" width="320" height="270" rx="15" fill="white" stroke="#a7b9ab"/><rect x="381" y="66" width="318" height="50" rx="14" fill="#14532d"/><text x="398" y="97" fill="white" font-size="18">Detalle</text><rect x="394" y="137" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="402" y="164" font-size="14" fill="#1e3924">Descripción del reto</text><rect x="394" y="194" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="402" y="221" font-size="14" fill="#1e3924">Inicio · cierre · puntos</text><rect x="394" y="251" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="402" y="278" font-size="14" fill="#1e3924">Ir al formulario →</text></g><g font-family="sans-serif"><rect x="730" y="65" width="320" height="270" rx="15" fill="white" stroke="#a7b9ab"/><rect x="731" y="66" width="318" height="50" rx="14" fill="#14532d"/><text x="748" y="97" fill="white" font-size="18">Ranking inicial</text><rect x="744" y="137" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="752" y="164" font-size="14" fill="#1e3924">Personas / grupos (propuesta)</text><rect x="744" y="194" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="752" y="221" font-size="14" fill="#1e3924">Ejemplo: 40 · 25 · 0 puntos</text><rect x="744" y="251" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="752" y="278" font-size="14" fill="#1e3924">Datos sintéticos</text></g><g font-family="sans-serif"><rect x="30" y="365" width="320" height="270" rx="15" fill="white" stroke="#a7b9ab"/><rect x="31" y="366" width="318" height="50" rx="14" fill="#14532d"/><text x="48" y="397" fill="white" font-size="18">Participación</text><rect x="44" y="437" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="52" y="464" font-size="14" fill="#1e3924">Evidencia textual [campo]</text><rect x="44" y="494" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="52" y="521" font-size="14" fill="#1e3924">Prototipo sin persistencia</text><rect x="44" y="551" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="52" y="578" font-size="14" fill="#1e3924">Previsualizar pendiente →</text></g><g font-family="sans-serif"><rect x="380" y="365" width="320" height="270" rx="15" fill="white" stroke="#a7b9ab"/><rect x="381" y="366" width="318" height="50" rx="14" fill="#14532d"/><text x="398" y="397" fill="white" font-size="18">Estado pendiente</text><rect x="394" y="437" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="402" y="464" font-size="14" fill="#1e3924">Ejemplo de estado pendiente</text><rect x="394" y="494" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="402" y="521" font-size="14" fill="#1e3924">Cero puntos otorgados</text><rect x="394" y="551" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="402" y="578" font-size="14" fill="#1e3924">Volver al catálogo →</text></g><g font-family="sans-serif"><rect x="730" y="365" width="320" height="270" rx="15" fill="white" stroke="#a7b9ab"/><rect x="731" y="366" width="318" height="50" rx="14" fill="#14532d"/><text x="748" y="397" fill="white" font-size="18">Móvil: navegación</text><rect x="744" y="437" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="752" y="464" font-size="14" fill="#1e3924">EcoReto     [Menú]</text><rect x="744" y="494" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="752" y="521" font-size="14" fill="#1e3924">Retos · Ranking · Participar</text><rect x="744" y="551" width="292" height="43" rx="7" fill="#f0f7f1"/><text x="752" y="578" font-size="14" fill="#1e3924">Una columna de tarjetas</text></g><text x="30" y="664" font-family="sans-serif" font-size="13">Bocetos de planificación. Las vistas demo no sustituyen persistencia ni moderación.</text></svg>